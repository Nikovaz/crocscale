  <circle cx="80" cy="80" r="3" fill="#00f2fe" opacity="0.7" />
  <circle cx="80" cy="0" r="2" fill="#9d4edd" opacity="0.5" />
  <circle cx="0" cy="80" r="2" fill="#9d4edd" opacity="0.5" />
