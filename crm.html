<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CrocScale Sales, Maps & Cloud CRM | Nicolás Galarza</title>
  
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Leaflet CSS & JS (Mapa Geográfico) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Supabase JS Client (Sincronización en la Nube Celular + PC) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-dark: #070911;
      --card-bg: #101322;
      --card-border: rgba(0, 242, 254, 0.15);
      --primary: #00f2fe;
      --primary-dark: #00a8b5;
      --accent-purple: #9d4edd;
      --accent-green: #10b981;
      --accent-gold: #f59e0b;
      --accent-red: #ef4444;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --input-bg: #171b30;
      --radius: 14px;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      --glow: 0 0 16px rgba(0, 242, 254, 0.2);
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden !important;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(157, 78, 221, 0.05) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    *, *:before, *:after {
      box-sizing: border-box;
    }

    /* HEADER RESPONSIVE */
    header {
      background: rgba(16, 19, 34, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 14px;
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      max-width: 100vw;
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(0, 242, 254, 0.4));
    }

    .brand-title h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      background: linear-gradient(90deg, #fff, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }

    .brand-title p {
      font-size: 0.68rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    .sync-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 5px;
      border-radius: 8px;
      font-size: 0.62rem;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .sync-status-badge.syncing {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.3);
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-view-toggle {
      background: var(--input-bg);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 6px 10px;
      border-radius: 16px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn-view-toggle.active {
      background: var(--primary);
      color: #000;
      box-shadow: var(--glow);
    }

    .btn-icon {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--primary);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: var(--primary);
      color: var(--bg-dark);
    }

    /* CONTAINER */
    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 12px;
      overflow-x: hidden;
    }

    /* ALARM STRIP */
    .alerts-strip {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(245, 158, 11, 0.15));
      border: 1px solid rgba(239, 68, 68, 0.5);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      gap: 8px;
    }

    .alerts-strip i {
      color: var(--accent-red);
      font-size: 1rem;
    }

    /* METRICS STRIP */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
      width: 100%;
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 8px 4px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .metric-card span {
      font-size: 0.65rem;
      color: var(--text-muted);
      display: block;
      margin-bottom: 2px;
    }

    .metric-card strong {
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
    }

    .metric-card.green strong { color: var(--accent-green); }
    .metric-card.purple strong { color: #c084fc; }
    .metric-card.gold strong { color: var(--accent-gold); }

    /* MAP CONTAINER */
    #map-view-container {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 10px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      width: 100%;
    }

    #map-element {
      height: 380px;
      width: 100%;
      border-radius: 10px;
      z-index: 10;
    }

    /* SEARCH BAR */
    .search-box {
      margin-bottom: 14px;
      position: relative;
      width: 100%;
    }

    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary);
      font-size: 0.85rem;
    }

    .search-box input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 10px 14px 10px 36px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    /* FORM CARD & TABS */
    .main-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      position: relative;
      width: 100%;
    }

    .main-card.editing-mode {
      border-color: var(--accent-gold);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.25);
    }

    .edit-banner-strip {
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.25), rgba(245, 158, 11, 0.1));
      border: 1px solid var(--accent-gold);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: #fcd34d;
    }

    .form-mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 14px;
      background: var(--input-bg);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      width: 100%;
    }

    .btn-mode-tab {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 8px 4px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
    }

    .btn-mode-tab.active {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(157, 78, 221, 0.2));
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    /* FORM GRID */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
    }

    .full-width {
      grid-column: span 2;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }

    .form-group label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px 10px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      width: 100%;
    }

    .input-with-gps {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .btn-gps-here {
      background: rgba(0, 242, 254, 0.15);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 0 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* FOTO UPLOAD BOX */
    .photo-upload-box {
      border: 1px dashed var(--primary);
      background: rgba(0, 242, 254, 0.04);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
    }

    .photo-preview {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--primary);
      display: none;
    }

    .section-divider {
      grid-column: span 2;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      padding-top: 8px;
      margin-top: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-actions-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      width: 100%;
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--primary), var(--accent-purple));
      border: none;
      color: #000;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--glow);
      width: 100%;
    }

    .btn-submit.btn-update {
      background: linear-gradient(135deg, var(--accent-gold), #ea580c);
      color: #000;
    }

    .btn-cancel-edit {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--accent-red);
      color: #f87171;
      padding: 12px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
      display: none;
      align-items: center;
      gap: 4px;
    }

    /* FILTER BAR */
    .filter-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 14px;
      width: 100%;
      -webkit-overflow-scrolling: touch;
    }

    .filter-tab {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .filter-tab.active {
      background: var(--primary);
      color: #000;
      font-weight: 700;
      border-color: var(--primary);
    }

    /* PROSPECT CARDS LIST */
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .prospect-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
      position: relative;
      width: 100%;
    }

    .prospect-card.status-cerrado { border-left-color: var(--accent-green); }
    .prospect-card.status-propuesta { border-left-color: var(--accent-gold); }
    .prospect-card.status-visitado { border-left-color: #60a5fa; }
    .prospect-card.status-no_interesa { border-left-color: #64748b; opacity: 0.85; }
    .prospect-card.status-ya_tiene_bot { border-left-color: #f59e0b; }
    .prospect-card.status-pausa { border-left-color: var(--accent-red); }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
      gap: 6px;
    }

    .client-name h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      color: #fff;
      line-height: 1.2;
    }

    .client-name p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .badge-status {
      font-size: 0.68rem;
      padding: 3px 7px;
      border-radius: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      flex-shrink: 0;
    }

    .badge-status.cerrado { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge-status.propuesta { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.4); }
    .badge-status.visitado { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge-status.no_interesa { background: rgba(100, 116, 139, 0.2); color: #cbd5e1; border: 1px solid rgba(100, 116, 139, 0.4); }
    .badge-status.ya_tiene_bot { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .badge-status.pausa { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }

    /* CARD FOTO TARJETA */
    .card-photo-thumb {
      width: 100%;
      max-height: 130px;
      object-fit: cover;
      border-radius: 8px;
      margin: 6px 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }

    /* BARRA DE PAGO */
    .payment-status-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 6px 10px;
      margin: 8px 0;
      font-size: 0.78rem;
      gap: 6px;
    }

    .payment-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.7rem;
    }

    .payment-badge.al-dia { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .payment-badge.pendiente { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }

    .payment-bar-actions {
      display: flex;
      gap: 4px;
    }

    .btn-toggle-payment {
      background: var(--input-bg);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 0.68rem;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-cobrar-wsp {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      color: #34d399;
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 0.68rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-weight: 600;
    }

    /* FILA DE REDES SOCIALES Y WEB */
    .social-links-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 6px 0;
      padding: 4px 0;
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
      width: 100%;
    }

    .social-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 0.7rem;
      color: #e5e7eb;
      text-decoration: none;
    }

    .meta-ads-box {
      background: rgba(0, 242, 254, 0.05);
      border: 1px dashed rgba(0, 242, 254, 0.3);
      border-radius: 8px;
      padding: 6px 10px;
      margin: 6px 0;
      font-size: 0.75rem;
      width: 100%;
    }

    .meta-ads-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 2px;
    }

    .card-details-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin: 6px 0;
      font-size: 0.78rem;
      width: 100%;
    }

    .detail-item {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-item i { color: var(--primary); width: 12px; flex-shrink: 0; }
    .detail-item strong { color: #fff; }

    .card-notes {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.78rem;
      color: #d1d5db;
      margin: 6px 0 8px 0;
      border-left: 2px solid rgba(0, 242, 254, 0.4);
      word-break: break-word;
      width: 100%;
    }

    /* 1-TAP ACTION BUTTONS */
    .action-buttons-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      width: 100%;
    }

    .btn-action {
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 6px 2px;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      text-decoration: none;
      width: 100%;
    }

    .btn-action i { font-size: 0.85rem; }
    .btn-action.btn-wsp { background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.4); color: #34d399; }
    .btn-action.btn-call { background: rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.4); color: #60a5fa; }
    .btn-action.btn-map { background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.4); color: #fbbf24; }
    .btn-action.btn-vcard { background: rgba(157, 78, 221, 0.15); border-color: rgba(157, 78, 221, 0.4); color: #c084fc; }

    .card-footer-manage {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dashed rgba(255, 255, 255, 0.06);
      font-size: 0.72rem;
      width: 100%;
    }

    .btn-text-action {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 6px;
      border-radius: 4px;
    }

    .btn-text-action.edit-btn { color: #fcd34d; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); font-weight: 600; }
    .btn-text-action.delete:hover { color: var(--accent-red); }

    /* TOAST */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #101322;
      border: 1px solid var(--primary);
      color: #fff;
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 0.8rem;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), var(--glow);
      transition: transform 0.3s;
      z-index: 10000;

    // SINCRONIZAR DESDE SUPABASE EN LA NUBE
    async function syncFromSupabase() {

    async function geocodeAddress(addressStr) {
      if (!addressStr || addressStr.trim().length < 4) return null;

      try {
        let query = addressStr.trim();
        if (!query.toLowerCase().includes('argentina') && !query.toLowerCase().includes('caba') && !query.toLowerCase().includes('buenos aires')) {
          query += ', CABA, Argentina';
        } else if (!query.toLowerCase().includes('argentina')) {
          query += ', Argentina';
        }

        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
        const resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
        const data = await resp.json();

        if (data && data.length > 0) {
          return {
            lat: parseFloat(data[0].lat),
            lng: parseFloat(data[0].lon)
          };
        }
      } catch (err) {
        console.warn('Geocoding error:', err);
      }
      return null;
    }

      if (!navigator.geolocation) {
        showToast('Geolocalización no soportada');
        return;
      }

      showToast('📍 Detectando GPS...');
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        try {
          const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`;
          const resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
          const data = await resp.json();

          if (data && data.display_name) {
            const shortAddr = (data.address.road || '') + ' ' + (data.address.house_number || '') + ', ' + (data.address.suburb || data.address.city || 'CABA');
            document.getElementById('address').value = shortAddr.trim();

          showToast('✅ Ubicación GPS detectada');
        } catch (e) {
          document.getElementById('address').value = `GPS: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        }
      }, (err) => {

    function handlePhotoSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 700;
          let width = img.width;
          let height = img.height;

          if (width > height && width > maxDim) {
            height *= maxDim / width;
            width = maxDim;
          } else if (height > maxDim) {
            width *= maxDim / height;
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.65);
          const preview = document.getElementById('photoPreview');
          preview.src = currentPhotoBase64;
          preview.style.display = 'block';
          document.getElementById('btnRemovePhoto').style.display = 'inline-block';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

      if (!ig) return '';
      let clean = ig.trim().replace('@', '');

      return `https://instagram.com/${clean}`;
    }

    function formatWebUrl(web) {
      if (!web) return '';
      let clean = web.trim();
      if (clean.startsWith('http')) return clean;
      return `https://${clean}`;
    }

    function formatFacebookUrl(fb) {
      if (!fb) return '';
      let clean = fb.trim();
      if (clean.startsWith('http')) return clean;
      return `https://${clean}`;
    }

    function initMap() {
      if (!map) {
        map = L.map('map-element').setView([-34.6060, -58.4060], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap &copy; CARTO',
          maxZoom: 19
        }).addTo(map);
        markersLayer = L.layerGroup().addTo(map);
      }

      markersLayer.clearLayers();

      const validMarkers = [];

      prospects.forEach((p, idx) => {
        const lat = p.lat || (-34.605 + (idx % 5) * 0.004);
        const lng = p.lng || (-58.405 + ((idx * 3) % 5) * 0.004);

        let color = '#00f2fe';
        if (p.status === 'cerrado') color = '#10b981';
        else if (p.status === 'propuesta') color = '#f59e0b';
        else if (p.status === 'no_interesa') color = '#64748b';
        else if (p.status === 'ya_tiene_bot') color = '#eab308';
        else if (p.status === 'pausa') color = '#ef4444';
        else if (p.status === 'visitado') color = '#3b82f6';
        
        const customIcon = L.divIcon({
          className: 'custom-pin',
          html: `<div style="background:${color}; width:14px; height:14px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 8px ${color};"></div>`,
          iconSize: [14, 14]
        });

        const marker = L.marker([lat, lng], { icon: customIcon }).addTo(markersLayer);
        validMarkers.push([lat, lng]);

        const bestPhone = (p.phone || p.phoneBusiness || '').replace(/[^0-9]/g, '');
        const formattedPhone = bestPhone.startsWith('54') ? bestPhone : '549' + bestPhone;
        
        marker.bindPopup(`
          <div style="font-family:Inter,sans-serif; color:#000; font-size:0.8rem;">
            <strong style="font-size:0.95rem; color:#0b1120;">${p.businessName}</strong><br>
            <span style="color:#555;">${p.contactName || ''} • ${p.rubro}</span><br>
            <div style="margin:4px 0; color:#333;">
              <i class="fa-solid fa-location-dot"></i> ${p.address || 'Sin dirección'}<br>
              <strong>Estado:</strong> ${getStatusLabel(p.status)}<br>
              ${p.monthlyPlan > 0 ? `<strong>Abono:</strong> $${p.monthlyPlan} USD/m` : ''}
            </div>
            <div style="margin-top:6px; display:flex; gap:4px;">
              ${bestPhone ? `<a href="https://wa.me/${formattedPhone}" target="_blank" style="background:#10b981; color:#fff; padding:3px 6px; border-radius:4px; text-decoration:none; font-size:0.7rem; font-weight:700;">💬 WSP</a>` : ''}
              <a href="https://maps.google.com/?q=${encodeURIComponent(p.address || p.businessName)}" target="_blank" style="background:#00a8b5; color:#fff; padding:3px 6px; border-radius:4px; text-decoration:none; font-size:0.7rem; font-weight:700;">📍 GPS</a>
            </div>
          </div>
        `);
      });

      if (validMarkers.length > 0 && map) {
        try {
          const bounds = L.latLngBounds(validMarkers);
          map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
        } catch(e){}
      }

      setTimeout(() => map.invalidateSize(), 200);
    }

        const address = document.getElementById('address').value.trim();
        const notes = document.getElementById('notes').value.trim();
        const visitDate = document.getElementById('visitDate').value || new Date().toISOString().slice(0, 10);

        let serviceTypeValue = 'chatbot';
        let monthlyValue = 0;
        let systemTotalValue = '$0';

          monthlyValue = document.getElementById('monthlyPlan') ? (parseInt(document.getElementById('monthlyPlan').value) || 0) : 0;
          systemTotalValue = document.getElementById('systemTotal') ? (document.getElementById('systemTotal').value.trim() || '$0') : '$0';
          setupPriceValue = document.getElementById('setupPrice') ? document.getElementById('setupPrice').value.trim() : '';
          metaAdsCapValue = document.getElementById('metaAdsCap') ? document.getElementById('metaAdsCap').value.trim() : '';
          billingDayValue = document.getElementById('billingDay') ? document.getElementById('billingDay').value : '16';
          paymentStatusValue = document.getElementById('paymentStatus') ? document.getElementById('paymentStatus').value : 'al_dia';
        }

        showToast('📍 Geocodificando...');
        let coords = await geocodeAddress(address);

        const recordId = editingId || ('rec_' + Date.now());

        const newOrUpdatedRecord = {
          id: recordId,
          businessName,
          contactName,
          phone,
          phoneBusiness,
          instagram,
          website,
          facebook,
          rubro,
          serviceType: serviceTypeValue,
          status: statusValue,
          monthlyPlan: monthlyValue,
          systemTotal: systemTotalValue,
          setupPrice: setupPriceValue,
          metaAdsCap: metaAdsCapValue,
          billingDay: billingDayValue,
          paymentStatus: paymentStatusValue,
          address,
          lat: coords ? coords.lat : null,
          lng: coords ? coords.lng : null,
          notes,
          visitDate,
          photo: currentPhotoBase64,
          updatedAt: new Date().toISOString()
        };

        if (editingId) {
          const index = prospects.findIndex(item => item.id === editingId);
          if (index !== -1) {
            newOrUpdatedRecord.photo = currentPhotoBase64 || prospects[index].photo || '';
            if (!coords && prospects[index].lat) {
              newOrUpdatedRecord.lat = prospects[index].lat;
              newOrUpdatedRecord.lng = prospects[index].lng;
            }
            prospects[index] = { ...prospects[index], ...newOrUpdatedRecord };
          }
          showToast('✏️ Registro actualizado');
        } else {
          newOrUpdatedRecord.createdAt = new Date().toISOString();
          prospects.unshift(newOrUpdatedRecord);
          showToast(isStreet ? '🚶‍♂️ Visita guardada' : '💼 Cliente guardado');
        }

        localStorage.setItem(STORAGE_KEY, JSON.stringify(prospects));

        if (supabaseClient) {
          try {
            const dbPayload = {
              id: newOrUpdatedRecord.id,
              business_name: newOrUpdatedRecord.businessName,
              contact_name: newOrUpdatedRecord.contactName,
              phone: newOrUpdatedRecord.phone,
              phone_business: newOrUpdatedRecord.phoneBusiness,
              instagram: newOrUpdatedRecord.instagram,
              website: newOrUpdatedRecord.website,
              facebook: newOrUpdatedRecord.facebook,
              rubro: newOrUpdatedRecord.rubro,
              service_type: newOrUpdatedRecord.serviceType,
              status: newOrUpdatedRecord.status,
              monthly_plan: newOrUpdatedRecord.monthlyPlan,
              system_total: newOrUpdatedRecord.systemTotal,
              setup_price: newOrUpdatedRecord.setupPrice,
              meta_ads_cap: newOrUpdatedRecord.metaAdsCap,
              billing_day: parseInt(newOrUpdatedRecord.billingDay) || 1,
              payment_status: newOrUpdatedRecord.paymentStatus,
              address: newOrUpdatedRecord.address,
              lat: newOrUpdatedRecord.lat,
              lng: newOrUpdatedRecord.lng,
              photo: newOrUpdatedRecord.photo,
              visit_date: newOrUpdatedRecord.visitDate,
              notes: newOrUpdatedRecord.notes
            };

            await supabaseClient.from('crm_prospects').upsert(dbPayload, { onConflict: 'id' });
          } catch(e){}
        }
        
        cancelEditing();
        renderCards();
        updateMetrics();
        checkBillingAlerts();
        if (map) initMap();
      } catch (err) {
        console.error('Error al guardar:', err);
        alert('Hubo un problema al guardar. Revisá los campos.');
      }
    }

    async function deleteProspect(id) {
      if (confirm('¿Eliminar este registro?')) {
        prospects = prospects.filter(p => p.id !== id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(prospects));
        renderCards();
        updateMetrics();
        checkBillingAlerts();
        if (map) initMap();

        if (supabaseClient) {
          try {
            await supabaseClient.from('crm_prospects').delete().eq('id', id);
          } catch(e){}
        }

        showToast('Registro eliminado');
      }
    }

    function downloadVCard(name, phone, company, address) {
      const vcardContent = `BEGIN:VCARD\nVERSION:3.0\nFN:${name} (${company})\nORG:${company}\nTEL;TYPE=CELL:${phone}\nADR;TYPE=WORK:;;${address};;;;\nNOTE:Contacto CrocScale IA\nEND:VCARD`;
      const blob = new Blob([vcardContent], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.setAttribute('download', `${name.replace(/\s+/g, '_')}.vcf`);
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('Descargando contacto...');
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      if (el) el.classList.add('active');
      renderCards();
    }

    function updateMetrics() {
      document.getElementById('metric-total').innerText = prospects.length;
      document.getElementById('count-todos').innerText = prospects.length;
      
      const totalMRR = prospects.reduce((acc, p) => acc + (p.monthlyPlan || 0), 0);
      document.getElementById('metric-mrr').innerText = `$${totalMRR.toLocaleString()} USD`;

      const totalSystems = prospects.filter(p => p.serviceType === 'sistema_medida' || p.serviceType === 'hibrido').length;
      document.getElementById('metric-systems').innerText = `${totalSystems} Proyectos`;

      const streetCount = prospects.filter(p => p.status === 'visitado' || p.status === 'no_interesa' || p.status === 'ya_tiene_bot').length;
      document.getElementById('metric-street').innerText = `${streetCount}`;
    }

    function getStatusLabel(s) {
      switch(s) {
        case 'cerrado': return '✅ Activo';
        case 'propuesta': return '🚀 En Propuesta';
        case 'visitado': return '🔵 Visitado';
        case 'no_interesa': return '⚪ No le Interesa';
        case 'ya_tiene_bot': return '🟡 Ya tiene Bot';
        case 'pausa': return '⚠️ En Pausa';
        default: return s;
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(prospects, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `crocscale_crm_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('Backup JSON descargado');
    }

    function exportToCSV() {
      if (prospects.length === 0) {
        showToast('No hay datos para exportar');
        return;
      }

      const headers = ["Negocio", "Contacto", "Fecha_Visita", "Telefono_Personal", "Telefono_Business", "Instagram", "Website", "Facebook", "Rubro", "Tipo_Servicio", "Estado", "Abono_USD", "Total_Sistema", "Setup_Cuotas", "Meta_Ads_Cap", "Dia_Vencimiento", "Estado_Pago", "Direccion", "Lat", "Lng", "Notas"];
      const rows = prospects.map(p => [
        `"${p.businessName}"`,
        `"${p.contactName || ''}"`,
        `"${p.visitDate || ''}"`,
        `"${p.phone || ''}"`,
        `"${p.phoneBusiness || ''}"`,
        `"${p.instagram || ''}"`,
        `"${p.website || ''}"`,
        `"${p.facebook || ''}"`,
        `"${p.rubro}"`,
        `"${p.serviceType}"`,
        `"${p.status}"`,
        p.monthlyPlan || 0,
        `"${p.systemTotal || ''}"`,
        `"${p.setupPrice || ''}"`,
        `"${p.metaAdsCap || ''}"`,
        `"${p.billingDay || ''}"`,
        `"${p.paymentStatus || ''}"`,
        `"${p.address || ''}"`,
        p.lat || '',
        p.lng || '',
        `"${(p.notes || '').replace(/"/g, '""')}"`
      ]);

      const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
      const a = document.createElement("a");
      a.setAttribute("href", encodeURI(csvContent));
      a.setAttribute("download", `crocscale_clientes_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('Descargando archivo Excel / CSV...');
    }
  </script>
</body>
</html>
